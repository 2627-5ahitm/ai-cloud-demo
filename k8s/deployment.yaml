apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbox
  labels:
    app: devbox
spec:
  replicas: 1
  # RWO volume: the old pod must die before the new one can mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devbox
  template:
    metadata:
      labels:
        app: devbox
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: devbox
          # Toolchain and its env (PATH, JAVA_HOME, ...) are baked into the image.
          image: ghcr.io/htl-leonding/devbox
          # No foreground workload: all work arrives through `kubectl exec`.
          # The PVC starts empty, so create the work dirs before going idle.
          command: ["/usr/bin/tini", "--", "/bin/bash", "-c"]
          args:
            - |
              mkdir -p /work/projects /work/.m2/repository /work/.npm
              touch /work/.devbox-ready
              exec sleep infinity
          workingDir: /work/projects
          ports:
            - name: quarkus
              containerPort: 8080
            - name: node
              containerPort: 3000
          readinessProbe:
            exec:
              command: ["test", "-f", "/work/.devbox-ready"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              ephemeral-storage: 500Mi
            limits:
              cpu: "4"
              memory: 6Gi
              # Container FS: /tmp, Playwright/Chromium scratch, global npm installs.
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: devbox-work
