apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace is intentionally NOT set: the active kubeconfig context already
# points at the right namespace.

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: devbox-bootstrap
    files:
      - bootstrap.sh

# Keep the ConfigMap name stable so `kubectl apply -k` updates it in place;
# the Deployment references it by plain name.
generatorOptions:
  disableNameSuffixHash: true
