apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace is intentionally NOT set: the active kubeconfig context already
# points at the right namespace.

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# Bump newTag for every image build (see image/Dockerfile) so a rollout
# really pulls the new image.
images:
  - name: ghcr.io/htl-leonding/devbox
    newTag: "20261012-115832"
